name: Lumina OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking core project structure..."
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f docs/WHITEPAPER.md
          test -f docs/YGGDRASIL.md
          test -f docs/NEXUS.md
          test -d src
          test -d scripts
          test -d configs
          test -d build
          test -d debian
          echo "All required files and directories present."

      - name: Markdown lint (basic)
        run: |
          # Simple check that important docs are not empty
          if [ ! -s docs/WHITEPAPER.md ]; then
            echo "ERROR: Whitepaper is empty"
            exit 1
          fi
          if [ ! -s README.md ]; then
            echo "ERROR: README is empty"
            exit 1
          fi
          echo "Markdown files look good."

      - name: Shell script syntax check
        run: |
          if ls scripts/*.sh 1> /dev/null 2>&1; then
            echo "Checking shell scripts..."
            for script in scripts/*.sh; do
              bash -n "$script" || exit 1
            done
            echo "Shell scripts syntax OK."
          else
            echo "No shell scripts found yet – skipping."
          fi

  structure-report:
    name: Project Structure Report
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project structure
        run: |
          echo "=== Lumina OS Project Structure ==="
          find . -type f -not -path './.git/*' | sort
